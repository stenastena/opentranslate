<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>OpenTranslate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <div class="lang-bar">
        <select id="source-lang" aria-label="Source language">
          <option value="auto">Auto-Detect</option>
        </select>
        <button id="swap-langs" type="button" title="Swap languages">&#8646;</button>
        <select id="target-lang" aria-label="Target language"></select>
        <button id="translate-btn" type="button">Translate</button>
      </div>

      <div class="tabs" id="provider-tabs"></div>

      <section class="section">
        <h2>
          Original
          <button id="speak-original-btn" type="button" class="speak-btn" title="Speak" aria-label="Speak original text">&#128266;</button>
        </h2>
        <textarea id="original-text" class="text-block" spellcheck="false"></textarea>
      </section>

      <section class="section">
        <h2>
          Translation<span id="translation-gender" class="gender-badge" hidden></span>
          <button id="speak-translation-btn" type="button" class="speak-btn" title="Speak" aria-label="Speak translation" disabled>&#128266;</button>
        </h2>
        <textarea id="translation-text" class="text-block" spellcheck="false" readonly></textarea>
      </section>

      <section class="section">
        <h2>Back-translation</h2>
        <div id="back-translation-text" class="text-block"></div>
      </section>

      <details id="dictionary-section" class="dictionary-section" hidden>
        <summary>Dictionary</summary>
        <div id="dictionary-content"></div>
      </details>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
